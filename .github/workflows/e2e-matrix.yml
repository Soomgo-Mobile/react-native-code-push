name: E2E Matrix

on:
  workflow_dispatch:
    inputs:
      run_ios:
        description: Run iOS E2E jobs
        required: false
        default: true
        type: boolean
      run_android:
        description: Run Android E2E jobs
        required: false
        default: true
        type: boolean
      exclude_timing_sensitive:
        description: Exclude timing-sensitive optional scenarios (ON_NEXT_RESUME/ON_NEXT_SUSPEND)
        required: false
        default: true
        type: boolean

jobs:
  resolve-app-matrix:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.resolve.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve app matrix
        id: resolve
        shell: bash
        run: |
          mapfile -t apps < <(
            find Examples -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
              | grep -v '^CodePushDemoApp$' \
              | sort
          )

          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No app found to run E2E."
            exit 1
          fi

          apps_json="$(printf '%s\n' "${apps[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "Resolved apps: $apps_json"
          echo "apps=$apps_json" >> "$GITHUB_OUTPUT"

  e2e-ios:
    if: ${{ inputs.run_ios }}
    needs: resolve-app-matrix
    name: e2e-ios (${{ matrix.app }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.resolve-app-matrix.outputs.apps) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Ruby (cache gems)
        if: ${{ hashFiles(format('Examples/{0}/Gemfile', matrix.app)) != '' }}
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: Examples/${{ matrix.app }}/Gemfile
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install root dependencies
        run: npm i

      - name: Install example app dependencies
        run: npm i
        working-directory: Examples/${{ matrix.app }}

      - name: Build binary patch tools
        run: npx code-push build-patch-tools
        working-directory: Examples/${{ matrix.app }}

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            Examples/${{ matrix.app }}/ios/Pods
          key: ${{ runner.os }}-pods-${{ matrix.app }}-${{ hashFiles(format('Examples/{0}/ios/Podfile', matrix.app), format('Examples/{0}/ios/Podfile.lock', matrix.app), format('Examples/{0}/Gemfile.lock', matrix.app)) }}
          restore-keys: |
            ${{ runner.os }}-pods-${{ matrix.app }}-

      - name: Install Speedrun PoC
        env:
          SPEEDRUN_POC_DIR: ${{ runner.temp }}/speedrun-poc
        run: |
          curl -fsSL https://raw.githubusercontent.com/hubastard/speedrun/v0.4.4/install.sh -o "$RUNNER_TEMP/install-speedrun.sh"
          SPEEDRUN_VERSION=v0.4.4 SPEEDRUN_DIR="$SPEEDRUN_POC_DIR" SPEEDRUN_NO_MODIFY_PATH=1 bash "$RUNNER_TEMP/install-speedrun.sh"
          python3 e2e/speedrun-ci-poc.py
          echo "SPEEDRUN_POC_DIR=$SPEEDRUN_POC_DIR" >> "$GITHUB_ENV"
          echo "$SPEEDRUN_POC_DIR/bin" >> "$GITHUB_PATH"

      - name: Select Xcode
        env:
          E2E_APP: ${{ matrix.app }}
        run: |
          case "$E2E_APP" in
            Expo56|Expo57) XCODE_VERSION=26.4 ;;
            *) XCODE_VERSION=26.3 ;;
          esac
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Select iOS simulator
        id: boot-simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | node -e '
            const fs = require("fs");
            const input = fs.readFileSync(0, "utf8");
            const data = JSON.parse(input);
            const runtimes = Object.values(data.devices);
            for (const devices of runtimes) {
              for (const device of devices) {
                if (device.isAvailable && typeof device.name === "string" && device.name.startsWith("iPhone")) {
                  process.stdout.write(device.udid);
                  process.exit(0);
                }
              }
            }
            process.exit(1);
          ')"
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found."
            exit 1
          fi
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "simulator_udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"

      - name: Reset Xcode module cache
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex

      - name: Run iOS E2E
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          E2E_RETRY_COUNT: "3"
          E2E_RETRY_DELAY_SEC: "30"
          E2E_EXCLUDE_TIMING_SENSITIVE: ${{ inputs.exclude_timing_sensitive }}
        run: |
          TIMING_SENSITIVE_ARG=""
          if [ "$E2E_EXCLUDE_TIMING_SENSITIVE" = "true" ]; then
            TIMING_SENSITIVE_ARG="--exclude-timing-sensitive"
          fi

          if [ "${{ startsWith(matrix.app, 'Expo') }}" = "true" ]; then
            npm run e2e -- --app "${{ matrix.app }}" --platform ios --simulator "${{ steps.boot-simulator.outputs.simulator_udid }}" --framework expo --retry-count "$E2E_RETRY_COUNT" --retry-delay-sec "$E2E_RETRY_DELAY_SEC" $TIMING_SENSITIVE_ARG
          else
            npm run e2e -- --app "${{ matrix.app }}" --platform ios --simulator "${{ steps.boot-simulator.outputs.simulator_udid }}" --retry-count "$E2E_RETRY_COUNT" --retry-delay-sec "$E2E_RETRY_DELAY_SEC" $TIMING_SENSITIVE_ARG
          fi

      - name: Upload Speedrun debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: speedrun-ios-${{ matrix.app }}-debug
          path: ${{ runner.temp }}/speedrun-poc/debug
          if-no-files-found: ignore

  e2e-android:
    if: ${{ inputs.run_android }}
    needs: resolve-app-matrix
    name: e2e-android (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.resolve-app-matrix.outputs.apps) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install root dependencies
        run: npm i

      - name: Install example app dependencies
        run: npm i
        working-directory: Examples/${{ matrix.app }}

      - name: Build binary patch tools
        run: npx code-push build-patch-tools
        working-directory: Examples/${{ matrix.app }}

      - name: Apply Expo Android CI build overrides
        run: node scripts/e2e/apply-expo-android-ci-overrides.js
        env:
          E2E_EXPO_ANDROID_OVERRIDE_ENABLED: ${{ startsWith(matrix.app, 'Expo') }}
          E2E_EXPO_ANDROID_APP_JSON_PATH: Examples/${{ matrix.app }}/app.json

      - name: Install Speedrun PoC
        env:
          SPEEDRUN_POC_DIR: ${{ runner.temp }}/speedrun-poc
        run: |
          curl -fsSL https://raw.githubusercontent.com/hubastard/speedrun/v0.4.4/install.sh -o "$RUNNER_TEMP/install-speedrun.sh"
          SPEEDRUN_VERSION=v0.4.4 SPEEDRUN_DIR="$SPEEDRUN_POC_DIR" SPEEDRUN_NO_MODIFY_PATH=1 bash "$RUNNER_TEMP/install-speedrun.sh"
          python3 e2e/speedrun-ci-poc.py
          echo "SPEEDRUN_POC_DIR=$SPEEDRUN_POC_DIR" >> "$GITHUB_ENV"
          echo "$SPEEDRUN_POC_DIR/bin" >> "$GITHUB_PATH"

      - name: Run Android E2E
        env:
          E2E_RETRY_COUNT: "3"
          E2E_RETRY_DELAY_SEC: "30"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          script: TIMING_SENSITIVE_ARG=$([ "${{ inputs.exclude_timing_sensitive }}" = "true" ] && echo "--exclude-timing-sensitive" || echo ""); if [ "${{ startsWith(matrix.app, 'Expo') }}" = "true" ]; then npm run e2e -- --app "${{ matrix.app }}" --platform android --framework expo --retry-count "$E2E_RETRY_COUNT" --retry-delay-sec "$E2E_RETRY_DELAY_SEC" $TIMING_SENSITIVE_ARG; else npm run e2e -- --app "${{ matrix.app }}" --platform android --retry-count "$E2E_RETRY_COUNT" --retry-delay-sec "$E2E_RETRY_DELAY_SEC" $TIMING_SENSITIVE_ARG; fi

      - name: Upload Speedrun debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: speedrun-android-${{ matrix.app }}-debug
          path: ${{ runner.temp }}/speedrun-poc/debug
          if-no-files-found: ignore
